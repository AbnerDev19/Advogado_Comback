server.port=8080

# As credenciais do banco NUNCA devem ficar fixas no código-fonte (ainda mais
# em um repositório no GitHub). Configure as variáveis de ambiente abaixo no
# seu computador (ou no painel do Render/Railway/etc ao fazer o deploy):
#   DB_URL=jdbc:postgresql://db.rbfeiuhvrompabewdtex.supabase.co:5432/postgres
#   DB_USERNAME=postgres
#   DB_PASSWORD=sua_senha_real_aqui
#   JWT_SECRET=uma_chave_secreta_bem_grande_e_aleatoria
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Chave usada para assinar os tokens JWT (ver security/JwtUtil.java).
app.jwt.secret=${JWT_SECRET:}